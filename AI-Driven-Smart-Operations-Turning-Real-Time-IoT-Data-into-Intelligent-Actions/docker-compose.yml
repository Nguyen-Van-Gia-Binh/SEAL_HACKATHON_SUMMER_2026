name: weather_smart_ops

services:
  # ==========================================
  # 1. MESSAGE BUS & STREAMING (Redpanda / Kafka)
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: weather-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - weather-net

  # Redpanda Console Web UI (Mapped to 8088 to avoid port 8080 collision)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: weather-redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "8088:8080"
    depends_on:
      - redpanda
    networks:
      - weather-net

  # ==========================================
  # 2. MQTT BROKER (Mosquitto)
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: weather-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - weather-net

  # ==========================================
  # 3. INGESTION BRIDGES (MQTT & CoAP)
  # ==========================================
  mqtt-bridge:
    build: .
    image: weather-platform/mqtt-bridge:latest
    container_name: weather-mqtt-bridge
    command: ["python", "-m", "src.ingestion.mqtt_bridge"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    depends_on:
      - redpanda
      - mosquitto
    restart: on-failure
    networks:
      - weather-net

  coap-gateway:
    build: .
    image: weather-platform/coap-gateway:latest
    container_name: weather-coap-gateway
    command: ["python", "-m", "src.ingestion.coap_gateway"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - COAP_HOST=0.0.0.0
      - COAP_PORT=5683
    ports:
      - "5683:5683/udp"
    depends_on:
      - redpanda
    restart: on-failure
    networks:
      - weather-net

  # ==========================================
  # 4. STREAM PROCESSING ENGINE
  # ==========================================
  stream-engine:
    build: .
    image: weather-platform/stream-engine:latest
    container_name: weather-stream-engine
    command: ["python", "-m", "src.stream_engine.processor"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - WATERMARK_DELAY_SECONDS=5.0
      - TUMBLING_WINDOW_SIZE_SEC=60
      - SLIDING_WINDOW_SIZE_SEC=300
      - SLIDING_WINDOW_SLIDE_SEC=60
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - redpanda
    restart: on-failure
    networks:
      - weather-net

  # ==========================================
  # 5. IoT WEATHER SIMULATOR
  # ==========================================
  weather-simulator:
    build: .
    image: weather-platform/weather-simulator:latest
    container_name: weather-simulator
    command: ["python", "-m", "src.ingestion.simulator"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - COAP_HOST=coap-gateway
      - COAP_PORT=5683
    depends_on:
      - redpanda
      - mosquitto
      - coap-gateway
    restart: on-failure
    networks:
      - weather-net

  # ==========================================
  # 6. WEB DASHBOARD & BACKEND API
  # ==========================================
  web-dashboard:
    build: .
    image: weather-platform/web-dashboard:latest
    container_name: weather-web-dashboard
    command: ["python", "-m", "src.backend.main"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_PORT=8000
      - API_HOST=0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      - redpanda
    restart: on-failure
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge
